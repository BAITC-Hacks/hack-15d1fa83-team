services:
  windpower-ml:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      MODEL_PATH: /model/model.json
      # Explicitly opt into the documented provisional timestamp alignment.
      ALLOW_PROVISIONAL_MODEL: "1"
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
