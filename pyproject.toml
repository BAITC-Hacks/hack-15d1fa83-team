[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hackalem-windpower"
version = "0.1.0"
description = "Weather-to-power training and inference for HackAlemAI turbines"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "tzdata>=2024.1"]

[project.optional-dependencies]
train = ["torch>=2.6,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
windpower-fetch = "windpower.archive:main"
windpower-assemble = "windpower.dataset:main"
windpower-train = "windpower.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

